# Pyproject used for the docker implementation of the Android World Environment
# only. The non-docker implementation uses a requirements.txt file.

[build-system]
requires = ["setuptools>=61.0", "grpcio-tools==1.71.0"]
build-backend = "setuptools.build_meta"

[project]
name = "android_world"
version = "0.1.0"
description = "Android World Environment Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "absl-py==2.1.0",
    "android_env==1.2.3",
    "dm_env==1.6",
    "fuzzywuzzy==0.18.0",
    "google-genai",
    "grpcio-tools==1.71.0",
    "protobuf==5.29.5",
    "immutabledict==2.0.0",
    "IPython",
    "jsonschema==4.17.3",
    "litellm",
    "numpy==1.26.3",
    "opencv-python",
    "pandas==2.1.4",
    "pillow",
    "pydub",
    "python-dotenv",
    "python-Levenshtein",
    "pytest",
    "qwen-vl-utils",
    "requests",
    "tenacity",
    "termcolor",
    "fastapi",
    "uvicorn",
    # vLLM serves xuyifan/MobileRL-9B (GLM-4.1V-9B base) via an OpenAI-compatible
    # endpoint.  run_uitars.py auto-launches it when --mode=local is used.
    "vllm>=0.4.0",
    # transformers is required by vLLM and by qwen-vl-utils image preprocessing.
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["*.json", "*.proto", "*.textproto", "*.xml", "res/xml/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py","*_test.py"]
